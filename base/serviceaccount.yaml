# ServiceAccount dedicada por workload (regra 3.5 — recomendado).
# automountServiceAccountToken: false porque a app não fala com a API (regra 3.4 — obrigatório).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyx-api
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: "time-nyx"
    metacortex.io/runbook: "https://wiki.metacortex.io/runbooks/nyx-api"
automountServiceAccountToken: false
