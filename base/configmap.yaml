# ConfigMap guarda o que NÃO é sensível (regra 4.7).
# Segredo em texto puro é proibido (regra 3.3) — valores sensíveis vão no Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nyx-api-config
  labels:
    app.kubernetes.io/name: nyx-api
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
data:
  LOG_LEVEL: "info"
  DB_HOST: "pg.nyx-prod.svc"
  # ERRADO — segredo em texto puro (regra 3.3 — proibido):
  # DATABASE_URL: "postgres://nyx:<SENHA-EM-TEXTO-PURO>@pg.nyx-prod.svc:5432/nyx"
  #
  # NOTA DIDATICA: a regra 3.3 proibe valor sensivel "nem em env.value, nem em
  # ConfigMap, nem em comentario". Por isso o exemplo negativo acima usa o
  # placeholder <SENHA-EM-TEXTO-PURO> em vez de uma string com aparencia de
  # credencial — mesmo sendo um exemplo didatico do que NAO fazer, evitamos
  # versionar qualquer texto que se parea com um segredo real.
